<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pairs bot</title>
<style>
:root{
  --bg:#0c0d10; --panel:#131519; --raised:#191c21; --line:#23262d; --line2:#2e323a;
  --text:#e6e8eb; --muted:#8a909b; --dim:#5a606a;
  --good:#4fd1a5; --bad:#f0717a; --warn:#e2b464; --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:#2f5d52}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#262a31;border-radius:6px;border:2px solid var(--bg)}
a{color:inherit}

.app{display:grid;grid-template-columns:216px 1fr;min-height:100%}
.side{border-right:1px solid var(--line);padding:22px 12px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-weight:600;letter-spacing:.01em}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px #4fd1a51f}
.nav a{display:block;padding:8px 10px;margin:1px 0;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer}
.nav a:hover{color:var(--text);background:#ffffff08}
.nav a.on{color:var(--text);background:var(--raised)}
.side .lang{margin:auto 10px 12px;align-self:flex-start}
.side .lang button{padding:3px 11px;font-size:12px}
.side .foot{padding:12px 10px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}
.side .foot b{color:var(--text);font-weight:500}

main{padding:28px 36px 60px;max-width:1280px;width:100%;min-width:0}
.head{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:20px;font-weight:600;margin:0;margin-right:auto}
.sub{color:var(--muted);font-size:13px}
h2{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.card.flush{padding:0;overflow:hidden}
.card.flush>h2{padding:16px 20px 0}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)} .g2{grid-template-columns:1fr 1fr}
.grid .card{margin:0;min-width:0}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.stat .h{color:var(--dim);font-size:12px;margin-top:2px}

.btn{font:inherit;color:var(--text);background:var(--raised);border:1px solid var(--line2);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#414651}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--text);border-color:var(--text);color:#0c0d10;font-weight:600}
.btn.primary:hover{background:#fff}
.btn.danger{color:var(--bad);border-color:#f0717a55}
.btn.small{padding:3px 10px;font-size:12px}
.btn.link{background:none;border:none;color:var(--muted);padding:4px 6px}
.btn.link:hover{color:var(--text)}

.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{font:inherit;color:var(--muted);background:none;border:0;border-radius:6px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--raised);color:var(--text)}

input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:#4fd1a588}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--good)}
input[type=date]{color-scheme:dark}
textarea{width:100%;font:12.5px/1.55 ui-monospace,Consolas,monospace;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}

.tw{overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
td{padding:10px 14px;border-bottom:1px solid #1b1e23;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;color:var(--muted);min-width:260px}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#ffffff05}
tbody tr.sel td{background:#ffffff09}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .muted{color:var(--muted)} .dim{color:var(--dim)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.badge.good{color:var(--good);border-color:#4fd1a555;background:#4fd1a512}
.badge.bad{color:var(--bad);border-color:#f0717a55;background:#f0717a10}
.badge.warn{color:var(--warn);border-color:#e2b46455;background:#e2b46410}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:8px}
.dot.on{background:var(--good);box-shadow:0 0 0 4px #4fd1a51f}
.dot.wait{background:var(--warn)}

.banner{border:1px solid var(--line2);border-left:3px solid var(--warn);background:var(--panel);border-radius:8px;padding:11px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center}
.banner.bad{border-left-color:var(--bad)}
.banner pre{margin:0;white-space:pre-wrap;font:12.5px ui-monospace,Consolas,monospace;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:34px 20px}
.meter{display:inline-block;width:54px;height:4px;border-radius:2px;background:var(--line2);vertical-align:middle;margin-right:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--muted)}
.bars div{display:grid;grid-template-columns:170px 1fr 120px;align-items:center;gap:12px;padding:5px 0}
.bars .b{height:6px;border-radius:3px;background:var(--line)} .bars .b i{display:block;height:100%;border-radius:3px}
.bars span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.chart{position:relative}
.chart svg{display:block;width:100%}
.chart .tip{position:absolute;pointer-events:none;background:#0c0d10f2;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12px;white-space:nowrap;display:none;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12px;margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:2px;margin-right:6px;vertical-align:middle}

.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 32px}
.field{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #1b1e23}
.field .l{min-width:0}
.field .l b{font-weight:500;display:block}
.field .l span{color:var(--muted);font-size:12px;display:block}
.field input:not([type=checkbox]),.field select{width:100%;text-align:right}
.field .c{text-align:right}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:26px 0 4px;display:flex;gap:12px;align-items:center}
details summary{cursor:pointer;color:var(--muted)}
.log{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:12.5px/1.6 ui-monospace,Consolas,monospace;color:#b5bac3;white-space:pre;overflow:auto;max-height:68vh}
.log.short{max-height:220px}

#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:30}
.toast{background:var(--raised);border:1px solid var(--line2);border-left:3px solid var(--good);border-radius:8px;padding:10px 14px;max-width:420px;box-shadow:0 8px 30px #0008}
.toast.bad{border-left-color:var(--bad)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20}
.modal .card{width:460px;max-width:92vw;margin:0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--text);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.cover{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;z-index:40;padding:30px}
.cover code{background:var(--raised);padding:2px 8px;border-radius:6px}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px;overflow:auto}.brand{padding:0 8px;white-space:nowrap}.nav{display:flex}.side .lang{margin:0 0 0 auto}.side .foot{display:none}main{padding:20px 16px 50px}.g4,.g5{grid-template-columns:1fr 1fr}.g2,.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i></i><span id="brand"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="seg lang" id="lang"></div>
    <div class="foot" id="foot"></div>
  </aside>
  <main id="view"></main>
</div>
<div id="toasts"></div>
<div id="modal"></div>

let LANG = localStorage.getItem("lang") || ((navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en");
const MISSING = new Set();
function t(s, ...a) {
  let r = s;
  if (LANG === "ru") { if (RU[s] === undefined) MISSING.add(s); else r = RU[s]; }
  return a.length ? r.replace(/\{(\d)\}/g, (_, i) => a[i]) : r;
}
function tr(s) {
  if (LANG !== "ru" || !s) return s;
  for (const [re, to] of MSG_RU) s = s.replace(re, to);
  return s;
}
function plural(n, one, many, ru) {
  if (LANG !== "ru") return n === 1 ? one : many;
  const d = n % 10, h = n % 100;
  return d === 1 && h !== 11 ? ru[0] : d >= 2 && d <= 4 && (h < 12 || h > 14) ? ru[1] : ru[2];
}

async function api(path, body) {
  let r;
  try {
    r = await fetch(path, {method: body ? "POST" : "GET", body: body ? JSON.stringify(body) : undefined,
                           headers: {"X-Token": TOKEN, ...(body ? {"Content-Type": "application/json"} : {})}});
  } catch (e) { S.down = true; drawFoot(); throw new Error(t("The bot's interface server is not running.")); }
  S.down = false;
  const j = await r.json().catch(() => ({error: "Unexpected response"}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function job(kind, params) {
  const {id} = await api("/api/jobs", {kind, ...params});
  for (;;) {
    await sleep(600);
    const j = await api("/api/job?id=" + id);
    if (j.status === "done") return j.result;
    if (j.status === "error") throw new Error(j.error);
  }
}

}

/* ---------- chart ---------- */
function chart(el, {labels, series, hlines = [], height = 230, fmt = v => num(v, 2)}) {
  if (!el) return;
  const W = Math.max(el.clientWidth, 300), H = height, p = {l: 66, r: 10, t: 8, b: 22};
  const vals = series.flatMap(s => s.data).filter(v => v != null).concat(hlines.map(h => h.y));
  if (!vals.length || labels.length < 2) { el.innerHTML = `<div class="empty">${t("Not enough data to draw")}</div>`; return; }
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * .07; lo -= pad; hi += pad;
  const n = labels.length, x = i => p.l + (W - p.l - p.r) * i / (n - 1), y = v => p.t + (H - p.t - p.b) * (1 - (v - lo) / (hi - lo));
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    g += `<line x1="${p.l}" x2="${W - p.r}" y1="${y(v)}" y2="${y(v)}" stroke="#1d2026"/><text x="${p.l - 8}" y="${y(v) + 4}" text-anchor="end">${esc(fmt(v))}</text>`;
  }
  for (let k = 0; k <= 4; k++) {
    const i = Math.round((n - 1) * k / 4);
    g += `<text x="${x(i)}" y="${H - 5}" text-anchor="${k === 0 ? "start" : k === 4 ? "end" : "middle"}">${esc(labels[i])}</text>`;
  }
  for (const h of hlines) g += `<line x1="${p.l}" x2="${W - p.r}" y1="${y(h.y)}" y2="${y(h.y)}" stroke="${h.color}" stroke-dasharray="4 4" opacity=".7"/>`;
  for (const s of series) {
    let d = "", pen = false;
    s.data.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" style="font-size:11px;fill:#6b717c">${g}<line class="cur" y1="${p.t}" y2="${H - p.b}" stroke="#4a4f59" style="display:none"/></svg><div class="tip"></div>`;
  const svg = $("svg", el), cur = $(".cur", el), tip = $(".tip", el);
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - p.l) / (W - p.l - p.r) * (n - 1))));
    cur.setAttribute("x1", x(i)); cur.setAttribute("x2", x(i)); cur.style.display = "";
    tip.innerHTML = `<div class="muted">${esc(labels[i])}</div>` + series.map(s => `<div><span style="color:${s.color}">●</span> ${esc(s.name)} <b>${esc(s.data[i] == null ? "—" : fmt(s.data[i]))}</b></div>`).join("");
    tip.style.display = "block";
    const left = x(i) * r.width / W;
    tip.style.left = (left > r.width - 190 ? left - tip.offsetWidth - 12 : left + 12) + "px"; tip.style.top = "10px";
  };
  svg.onmouseleave = () => { cur.style.display = "none"; tip.style.display = "none"; };
}

    <div class="card"><h2>${t("Equity")}</h2><div class="chart" id="eq"></div></div>`;
    if (m.trades) {
      const bars = (obj, money) => { const mx = Math.max(...Object.values(obj).map(Math.abs), 1); return `<div class="bars">${Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div><span>${esc(money ? k : reasonText(k))}</span><span class="b"><i style="width:${Math.abs(v) / mx * 100}%;background:${money ? (v >= 0 ? "var(--good)" : "var(--bad)") : "var(--muted)"}"></i></span><span class="${money ? tone(v) : ""}">${money ? signed(v) : v}</span></div>`).join("")}</div>`; };
      out += `<div class="grid g2"><div class="card"><h2>${esc(t("P&L by pair"))}</h2>${bars(m.pnl_by_pair, true)}</div><div class="card"><h2>${t("Exit reasons")}</h2>${bars(m.exits, false)}</div></div>
      <div class="card flush"><h2>${t("Trades")}</h2><div class="tw" style="max-height:440px"><table><thead><tr><th>${t("Bought")}</th><th>${t("Entry")}</th><th>${t("Exit")}</th><th class="n">${t("Days")}</th><th class="n">${t("Qty")}</th><th class="n">${t("Entry price")}</th><th class="n">${t("Exit price")}</th><th class="n">Z</th><th class="n">TQS</th><th>${t("Exit reason")}</th><th class="n">${esc(t("P&L"))}</th></tr></thead><tbody>
      ${b.trades.map(x => `<tr><td><b>${esc(x.bought)}</b> <span class="muted">${t("vs")} ${esc(x.pair.split("/")[1])}</span></td><td>${esc(x.entry_date)}</td><td>${esc(x.exit_date)}</td><td class="n">${x.days_held}</td><td class="n">${num(x.qty, 0)}</td><td class="n">${num(x.entry_price)}</td><td class="n">${num(x.exit_price)}</td><td class="n">${num(x.z_entry)}</td><td class="n">${x.tqs}</td><td>${reason(x.reason)}</td><td class="n ${tone(x.pnl)}">${signed(x.pnl)}</td></tr>`).join("")}</tbody></table></div></div>`;
    }
  } else if (!busy) out += `<div class="card empty">${t("Run a backtest to simulate the strategy on daily history with your current settings.")}</div>`;
  if (w) out += `<div class="card flush"><h2>${t("Walk-forward")} · ${t("out-of-sample total")} <span class="${tone(w.total)}">${signed(w.total)}</span> · ${t("{0} data", esc(srcName(w.source)))}</h2>${w.folds.length ? `<div class="tw"><table><thead><tr><th>${t("Tuned on")}</th><th>${t("Tested on")}</th><th class="n">${t("Entry Z")}</th><th class="n">${t("Exit Z")}</th><th class="n">${t("Stop-loss")}</th><th class="n">${t("Trades")}</th><th class="n">${t("Win rate")}</th><th class="n">${t("Max DD")}</th><th class="n">${t("Net profit")}</th></tr></thead><tbody>
    ${w.folds.map(x => `<tr><td>${esc(x.train)}</td><td>${esc(x.test)}</td><td class="n">${num(x.entry_z)}</td><td class="n">${num(x.exit_z)}</td><td class="n">${num(x.stop_pct * 100, 1)}%</td><td class="n">${x.trades}</td><td class="n">${x.win_rate_pct == null ? "—" : num(x.win_rate_pct, 0) + "%"}</td><td class="n">${num(x.max_drawdown_pct)}%</td><td class="n ${tone(x.net_profit)}">${signed(x.net_profit)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">${t("Not enough history for one tuning window plus one test window.")}</div>`}</div>`;
  return out;
};
AFTER.backtest = () => {
  const b = S.bt;
  if (b && b.equity && b.equity.length) chart($("#eq"), {labels: b.equity.map(e => e[0]), series: [{name: t("Equity"), color: "#4fd1a5", data: b.equity.map(e => e[1])}], hlines: [{y: b.capital, color: "#5a606a"}], height: 260, fmt: v => num(v, 0)});
};
ENTER.backtest = async () => { if (!S.bt) { try { const last = await api("/api/backtest/last"); if (last.metrics && !S.bt) { S.bt = last; render(); } } catch (e) {} } };
ACT.backtest = async () => {
  S.btBusy = true; render();
  try { S.bt = await job("backtest", S.btForm); } catch (e) { fail(e); }
  S.btBusy = false; if (S.page === "backtest") render();
};
ACT.walkforward = async () => {
  S.wfBusy = true; render();
  try { S.wf = await job("walkforward", S.btForm); } catch (e) { fail(e); }
  S.wfBusy = false; if (S.page === "backtest") render();
};

/* ---------- journal ---------- */
const PASSPORT_COL = {date: "Date", corr: "Corr 120d", corr60: "Corr 60d", coint_p: "Coint. p", beta: "β", beta_chg: "β change", half_life: "Half-life", z: "Z-score", tqs: "TQS"};
VIEWS.journal = () => {
  const j = S.journal;
  if (!j) return `<div class="head"><h1>${t("Journal")}</h1></div><div class="card empty"><span class="spin"></span>${t("Loading…")}</div>`;
  const trades = j.trades.filter(x => S.jMode === "all" || x.mode === S.jMode).reverse();
  const pnl = trades.reduce((s, x) => s + Number(x.pnl || 0), 0), wins = trades.filter(x => Number(x.pnl) > 0).length;
  const seg = `<div class="seg">${["all", "paper", "sandbox", "live"].map(m => `<button data-act="jmode" data-v="${m}" class="${S.jMode === m ? "on" : ""}">${m === "all" ? t("All") : t(MODES[m][0])}</button>`).join("")}</div>`;
  const pp = S.passport;
  return `<div class="head"><h1>${t("Journal")}</h1>${seg}</div>
  <div class="grid g4">
    <div class="card stat"><div class="k">${t("Closed trades")}</div><div class="v">${trades.length}</div></div>
    <div class="card stat"><div class="k">${t("Result")}</div><div class="v ${tone(pnl)}">${signed(pnl)}</div></div>
    <div class="card stat"><div class="k">${t("Win rate")}</div><div class="v">${trades.length ? num(wins / trades.length * 100, 0) + "%" : "—"}</div></div>
    <div class="card stat"><div class="k">${t("Stopped out")}</div><div class="v">${trades.filter(x => x.reason === "stop").length}</div></div></div>
  <div class="card flush"><h2>${t("Trades")}</h2>${trades.length ? `<div class="tw" style="max-height:460px"><table><thead><tr><th>${t("Mode")}</th><th>${t("Bought")}</th><th>${t("Entry")}</th><th>${t("Exit")}</th><th class="n">${t("Qty")}</th><th class="n">${t("Entry price")}</th><th class="n">${t("Exit price")}</th><th class="n">${t("Stop-loss")}</th><th class="n">${t("Z in")}</th><th class="n">${t("Z out")}</th><th class="n">TQS</th><th>${t("Exit reason")}</th><th class="n">${esc(t("P&L"))}</th></tr></thead><tbody>
    ${trades.map(x => `<tr><td class="muted">${esc(MODES[x.mode] ? t(MODES[x.mode][0]) : x.mode)}</td><td><b>${esc(x.bought)}</b> <span class="muted">${t("vs")} ${esc((x.pair || "").split("/")[1])}</span></td><td>${esc(x.entry_date)}</td><td>${esc(x.exit_date)}</td><td class="n">${num(x.qty, 0)}</td><td class="n">${num(x.entry_price)}</td><td class="n">${num(x.exit_price)}</td><td class="n">${num(x.stop)}</td><td class="n">${num(x.z_entry)}</td><td class="n">${num(x.z_exit)}</td><td class="n">${esc(x.tqs)}</td><td>${reason(x.reason)}</td><td class="n ${tone(Number(x.pnl))}">${signed(Number(x.pnl))}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">${t("No closed trades yet. Every trade the bot closes is recorded here.")}</div>`}</div>
  <div class="card flush"><div class="row" style="padding:16px 20px 0"><h2 class="grow" style="margin:0">${t("Pair passports")}</h2>${j.passports.length ? `<select onchange="loadPassport(this.value)"><option value="">${t("Choose a pair…")}</option>${j.passports.map(n => `<option ${pp && pp.name === n ? "selected" : ""} value="${esc(n)}">${esc(n.replace("_", " " + t("vs") + " "))}</option>`).join("")}</select>` : ""}</div>
    ${pp && pp.rows.length ? `<div class="tw" style="max-height:360px;margin-top:10px"><table><thead><tr>${Object.keys(pp.rows[0]).map((k, i) => `<th class="${i ? "n" : ""}">${esc(PASSPORT_COL[k] ? t(PASSPORT_COL[k]) : label(k))}</th>`).join("")}</tr></thead><tbody>${pp.rows.slice().reverse().map(r => `<tr>${Object.values(r).map((v, i) => `<td class="${i ? "n" : ""}">${esc(i && v !== "" && !isNaN(v) ? num(v, String(v).includes(".") ? 3 : 0) : v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<div class="empty">${j.passports.length ? t("Daily statistics of each pair, recorded while the bot trades.") : t("Passports appear after the bot has run at least one trading cycle.")}</div>`}</div>`;
};
ENTER.journal = async () => { try { S.journal = await api("/api/journal"); render(); } catch (e) { fail(e); } };
ACT.jmode = el => { S.jMode = el.dataset.v; render(); };
async function loadPassport(name) {
  if (!name) { S.passport = null; return render(); }
  try { S.passport = {name, rows: (await api("/api/passport?name=" + encodeURIComponent(name))).rows}; render(); } catch (e) { fail(e); }
}

/* ---------- settings ---------- */
const SECTION = {general: ["General", "Capital and market data"], stats: ["Screen 1 · statistics", "Correlation, cointegration, β and Z-score thresholds"],
  entry: ["Screen 3 · entry", "15-minute chart filter used in paper, sandbox and live modes"], tqs: ["Trade quality score", "Which scores are allowed to trade"],
  risk: ["Risk and money management", "Fractions of capital: 0.005 means 0.5%"], costs: ["Costs", "Used by the simulations"],
  live: ["Trading session", "Times are Moscow time"], walkforward: ["Walk-forward", "Parameter values tried on each tuning window"]};
const fieldText = (sec, f) => (LANG === "ru" && FIELD_RU[sec + "." + f.key]) || [label(f.key), f.hint];
function fieldInput(sec, f) {
  const a = `data-sec="${sec}" data-key="${f.key}" data-type="${f.type}"`;
  if (f.type === "bool") return `<div class="c"><input type="checkbox" ${a} ${f.value ? "checked" : ""}></div>`;
  if (f.type === "list") return `<input ${a} value="${esc(f.value.join(", "))}" placeholder="${t("comma separated")}">`;
  if (f.key === "data_source") return `<select ${a}>${["auto", "tbank", "moex", "synthetic"].map(v => `<option ${f.value === v ? "selected" : ""}>${v}</option>`).join("")}</select>`;
  return `<input ${a} ${f.type === "str" ? "" : 'inputmode="decimal"'} value="${esc(f.value)}">`;
}
VIEWS.settings = () => {
  const c = S.cfg, o = S.ov;
  if (!c) return `<div class="head"><h1>${t("Settings")}</h1></div><div class="card empty"><span class="spin"></span>${t("Loading…")}</div>`;
  const acc = S.accounts, has = o && o.token_set;
  let out = `<div class="head"><h1>${t("Settings")}</h1><span class="sub">${o ? esc(o.folder) : ""}</span></div>
  <div class="card"><h2>${t("T-Bank connection")}</h2>
    <div class="row" style="margin-bottom:14px"><span class="badge ${has ? "good" : "warn"}">${has ? t("Token saved") : t("No token")}</span>
      <span class="sub grow">${has ? t("Stored in the .env file in the bot folder. It is never shown again here.") : t("Without a token the bot reads delayed public MOEX quotes and can only simulate. Create one in T-Investments → Settings → T-Invest API tokens.")}</span></div>
    <div class="row" style="align-items:flex-end">
      <label class="f grow">${has ? t("Replace token") : t("Token")}<input id="tok" type="password" autocomplete="off" placeholder="t.…"></label>
      <label class="f">${t("Sandbox token")} <input id="stok" type="password" autocomplete="off" placeholder="${o && o.sandbox_token_set ? t("saved") : t("if issued separately")}" style="width:200px"></label>
      <label class="f">${t("Account ID")} <input id="acc" autocomplete="off" placeholder="${o && o.account_id_set ? t("saved") : t("only with several accounts")}" style="width:200px"></label>
      <button class="btn primary" data-act="saveToken">${t("Save")}</button>
      <button class="btn" data-act="testToken" ${has ? "" : "disabled"}>${t("Test")}</button>
      <button class="btn" data-act="testToken" data-sandbox="1" ${has || (o && o.sandbox_token_set) ? "" : "disabled"}>${t("Test sandbox")}</button>
      ${has ? `<button class="btn link" data-act="clearToken">${t("Remove")}</button>` : ""}</div>
    ${acc ? `<div style="margin-top:14px">${acc.length ? `<table><thead><tr><th>${t("Account")}</th><th>ID</th><th>${t("Type")}</th><th>${t("Access")}</th><th></th></tr></thead><tbody>${acc.map(a => `<tr><td>${esc(a.name || "—")}</td><td class="mono">${esc(a.id)}</td><td class="muted">${esc(String(a.type).replace("ACCOUNT_TYPE_", ""))}</td><td class="muted">${esc(String(a.access).replace("ACCOUNT_ACCESS_LEVEL_", ""))}</td><td class="n"><button class="btn small" data-act="useAccount" data-v="${esc(a.id)}">${t("Use this account")}</button></td></tr>`).join("")}</tbody></table>` : `<span class="sub">${t("Connected. No accounts yet: a sandbox account is opened automatically on the first sandbox run.")}</span>`}</div>` : ""}</div>`;
  if (c.error) out += `<div class="banner bad"><div><b>${t("config.toml has an error")}</b><pre>${esc(tr(c.error))}</pre>${t("Fix it in the file editor below.")}</div></div>`;
  else {
    out += `<div class="card"><h2>${t("Pairs")}</h2><div class="sub" style="margin-bottom:10px">${t("Stocks of the same sector. The bot buys whichever of the two is lagging.")}</div><div id="pairs"></div></div>`;
    for (const s of c.sections) out += `<div class="card"><h2>${t(SECTION[s.name][0])}</h2><div class="sub" style="margin:-6px 0 8px">${t(SECTION[s.name][1])}</div><div class="fields">${s.fields.map(f => { const [name, hint] = fieldText(s.name, f); return `<div class="field"><div class="l"><b>${esc(name)}</b><span>${esc(hint)}</span></div>${fieldInput(s.name, f)}</div>`; }).join("")}</div></div>`;
  }
  out += `<div class="card"><details ${c.error ? "open" : ""}><summary>${t("Edit config.toml as text")}</summary><textarea id="raw" rows="22" spellcheck="false" style="margin-top:12px">${esc(c.raw)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="saveRaw">${t("Save file")}</button><span class="sub">${t("The file is checked before saving; the previous version is kept as config.toml.bak.")}</span></div></details></div>`;
  if (!c.error) out += `<div class="savebar"><button class="btn primary" data-act="saveConfig">${t("Save settings")}</button><button class="btn link" data-act="reloadConfig">${t("Discard changes")}</button><span class="sub">${t("A running trading process picks up new settings after it is restarted.")}</span></div>`;
  return out;
};
function drawPairs() {
  const el = $("#pairs"); if (!el) return;
  el.innerHTML = `<table style="width:auto"><thead><tr><th>${t("Stock A")}</th><th>${t("Stock B")}</th><th>${t("Sector")}</th><th></th></tr></thead><tbody>${S.cfgPairs.map((p, i) => `<tr>${["a", "b", "sector"].map(k => `<td style="padding:5px 10px 5px 0;border:0"><input value="${esc(p[k])}" oninput="S.cfgPairs[${i}].${k}=this.value" style="width:${k === "sector" ? 150 : 110}px;${k === "sector" ? "" : "text-transform:uppercase"}"></td>`).join("")}<td style="border:0;padding:5px 0"><button class="btn link" data-act="delPair" data-v="${i}">${t("Remove")}</button></td></tr>`).join("")}</tbody></table>
    <button class="btn small" data-act="addPair" style="margin-top:8px">${t("Add pair")}</button>`;
}
AFTER.settings = drawPairs;
ENTER.settings = async () => { try { S.cfg = await api("/api/config"); S.cfgPairs = S.cfg.pairs.map(p => ({...p})); S.accounts = null; render(); } catch (e) { fail(e); } };
ACT.reloadConfig = () => ENTER.settings();
ACT.addPair = () => { S.cfgPairs.push({a: "", b: "", sector: ""}); drawPairs(); };
ACT.delPair = el => { S.cfgPairs.splice(Number(el.dataset.v), 1); drawPairs(); };
function saved(r, what) { toast(what + (r.restart && r.restart.length ? ". " + t("Restart trading to apply: {0}.", r.restart.map(m => t(MODES[m][0])).join(", ")) : "")); }
ACT.saveConfig = async () => {
  const values = {}, orig = Object.fromEntries(S.cfg.sections.map(s => [s.name, Object.fromEntries(s.fields.map(f => [f.key, f.value]))]));
  for (const el of document.querySelectorAll("[data-sec]")) {
    const {sec, key, type} = el.dataset;
    let v = type === "bool" ? el.checked : el.value.trim();
    if (type === "list") { v = v.split(",").map(x => x.trim()).filter(Boolean); if (v.length && v.every(x => x !== "" && !isNaN(x))) v = v.map(Number); }
    else if (type === "int" || type === "float") { v = v.replace(",", "."); if (v === "" || isNaN(v)) return toast(t("{0} must be a number", fieldText(sec, {key, hint: ""})[0]), true); v = Number(v); }
    if (JSON.stringify(v) !== JSON.stringify(orig[sec][key])) (values[sec] ||= {})[key] = v;
  }
  try { saved(await api("/api/config", {values, pairs: S.cfgPairs}), t("Settings saved")); await refresh(); await ENTER.settings(); } catch (e) { fail(e); }
};
ACT.saveRaw = async () => { try { saved(await api("/api/config/raw", {text: $("#raw").value}), t("File saved")); await refresh(); await ENTER.settings(); } catch (e) { fail(e); } };
ACT.saveToken = async () => {
  const body = {};
  for (const [id, key] of [["tok", "token"], ["stok", "sandbox_token"], ["acc", "account_id"]]) if ($("#" + id).value.trim()) body[key] = $("#" + id).value.trim();
  if (!Object.keys(body).length) return toast(t("Enter a token or an account ID"), true);
  try { await api("/api/token", body); toast(t("Saved")); await refresh(); render(); } catch (e) { fail(e); }
};
ACT.clearToken = async () => { try { await api("/api/token", {clear: true}); toast(t("Token removed")); S.accounts = null; await refresh(); render(); } catch (e) { fail(e); } };
ACT.testToken = async el => { try { S.accounts = (await api("/api/token/test", {sandbox: !!el.dataset.sandbox})).accounts; toast(t("Connection works")); render(); } catch (e) { fail(e); } };
ACT.useAccount = async el => { try { await api("/api/token", {account_id: el.dataset.v}); toast(t("Account selected")); await refresh(); } catch (e) { fail(e); } };

/* ---------- logs ---------- */
VIEWS.logs = () => `<div class="head"><h1>${t("Logs")}</h1><span class="sub">logs/bot.log · ${t("refreshes automatically")}</span></div><div class="log" id="logbox"></div>`;
function drawLog() {
  const el = $("#logbox"); if (!el) return;
  const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  el.textContent = S.log.length ? S.log.join("\n") : t("Nothing logged yet. The log fills when paper, sandbox or live trading runs.");
  if (stick) el.scrollTop = el.scrollHeight;
}
AFTER.logs = () => { drawLog(); const el = $("#logbox"); if (el) el.scrollTop = el.scrollHeight; };
ENTER.logs = () => refresh();

/* ---------- wiring ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled && ACT[el.dataset.act]) ACT[el.dataset.act](el);
});
function route() {
  const id = location.hash.replace("#/", "");
  S.page = VIEWS[id] ? id : "dashboard";
  render();
  window.scrollTo(0, 0);
  (ENTER[S.page] || (() => {}))();
}
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => (AFTER[S.page] || (() => {}))(), 150); });
window.addEventListener("hashchange", route);
if (TOKEN.startsWith("__")) {
  document.body.insertAdjacentHTML("beforeend", `<div class="cover"><div><h1 style="font-size:20px">${t("Start the interface with")} <code>ui.bat</code></h1><p class="muted">${t("This page talks to the bot running on your computer, so it has to be opened by the bot.")}<br>${t("Double-click {0} in the bot folder, or run {1}.", "<code>ui.bat</code>", "<code>.\\run.bat ui</code>")}</p></div></div>`);
} else {
  route();
  refresh();
  setInterval(refresh, 4000);
}
</script>
</body>
